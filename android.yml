name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android source files
        run: |
          echo "=== PROJECT ==="
          pwd
          echo "=== MAIN FILES ==="
          find app/src/main -type f -print
          echo "=== JAVA FILES ==="
          find app/src/main -type f -name "*.java" -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
