name: Build AVESON CENTRAL CORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Project Files
        run: |
          echo "=== PROJECT ==="
          pwd

          echo "=== MAIN FILES ==="
          find app/src/main -type f -print

          echo "=== JAVA FILES ==="
          find app/src/main -type f -name "*.java" -print

          echo "=== MAIN ACTIVITY ==="
          if [ -f app/src/main/java/com/aveson/central/MainActivity.java ]; then
            echo "MainActivity.java FOUND"
          else
            echo "ERROR: MainActivity.java NOT FOUND"
            exit 1
          fi

      - name: Build APK
        run: |
          gradle clean assembleDebug

      - name: Check APK
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-CORE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
